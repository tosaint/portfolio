<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>老照片對位工具｜中壢神社</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<style>
  :root { --ink:#1d1b17; --paper:#f6f2e8; --accent:#b23a2a; --ok:#2f6f4f; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#2a2824; color:var(--ink);
    font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; }
  button, select { font:inherit; color:inherit; }
  #app { position:fixed; inset:0; display:grid; grid-template-rows:auto 1fr 1fr auto; }
  @media (min-aspect-ratio: 1/1) { #app { grid-template-columns:1fr 1fr; grid-template-rows:auto 1fr auto; }
    header, footer { grid-column:1 / 3; } }
  header { display:flex; gap:8px; align-items:center; padding:calc(env(safe-area-inset-top) + 8px) 10px 8px; background:var(--paper); }
  header b { font-size:15px; margin-right:auto; }
  header select, header label { font-size:13px; border:1px solid #d8cfba; background:#fff; border-radius:8px; padding:5px 8px; }
  header input { display:none; }
  .pane { position:relative; overflow:hidden; touch-action:none; }
  #photoPane { background:#111; }
  #photoPane canvas { position:absolute; inset:0; width:100%; height:100%; }
  #overlay3d { position:absolute; left:0; top:0; transform-origin:0 0; pointer-events:none; opacity:0; }
  #modelPane { background:#e9e6dc; border-top:2px solid #000; }
  @media (min-aspect-ratio: 1/1) { #modelPane { border-top:0; border-left:2px solid #000; } }
  #modelPane canvas { display:block; }
  .paneTag { position:absolute; top:6px; left:8px; font-size:11px; color:#fff; background:rgba(0,0,0,.5); padding:2px 7px; border-radius:6px; pointer-events:none; z-index:3; }
  #modelPane .paneTag { color:var(--ink); background:rgba(255,255,255,.75); }
  #labels3d { position:absolute; inset:0; pointer-events:none; }
  #labels3d span { position:absolute; transform:translate(-50%,-140%); font-size:11px; font-weight:700; color:#fff; background:var(--accent); border-radius:50%;
    width:18px; height:18px; display:flex; align-items:center; justify-content:center; }
  #labels3d span.sel { background:#1a73e8; }
  #loupe { position:absolute; width:120px; height:120px; border-radius:50%; border:3px solid #fff; box-shadow:0 2px 12px rgba(0,0,0,.6);
    top:8px; right:8px; display:none; z-index:4; pointer-events:none; }
  footer { background:var(--paper); padding:8px 10px calc(env(safe-area-inset-bottom) + 8px); }
  .pairs { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; }
  .pairs::-webkit-scrollbar { display:none; }
  .pairs button { flex:0 0 auto; min-width:40px; border:1px solid #d8cfba; background:#fff; border-radius:999px; padding:5px 10px; font-size:13px; }
  .pairs button.sel { border-color:#1a73e8; box-shadow:0 0 0 2px #1a73e8 inset; }
  .pairs button.done { background:#e7f0ea; }
  .pairs small { color:#8a6b45; margin-left:3px; }
  .row { display:flex; gap:6px; align-items:center; }
  .row button { border:0; border-radius:10px; padding:8px 10px; font-size:13px; font-weight:700; background:#e4ddcc; }
  .row button.main { background:var(--ink); color:var(--paper); }
  #status { font-size:12px; color:#4a463d; margin:6px 0; min-height:1.4em; }
  #status b.ok { color:var(--ok); } #status b.bad { color:var(--accent); }
  .fadeRow { display:none; align-items:center; gap:8px; font-size:12px; }
  .fadeRow.show { display:flex; }
  .fadeRow input { flex:1; accent-color:var(--accent); }
  #help { font-size:11px; color:#8a817a; }
  #toast { position:fixed; top:30%; left:50%; transform:translate(-50%,-50%); z-index:30; background:rgba(29,27,23,.92); color:#fff;
    padding:10px 16px; border-radius:12px; font-size:14px; display:none; max-width:84vw; text-align:center; }
</style>
</head>
<body>
<div id="app">
  <header>
    <b>老照片對位</b>
    <select id="photoSel"></select>
    <label>上傳…<input type="file" id="file" accept="image/*"></label>
  </header>
  <div class="pane" id="photoPane">
    <canvas id="photoCanvas"></canvas>
    <canvas id="overlay3d"></canvas>
    <canvas id="loupe" width="240" height="240"></canvas>
    <span class="paneTag">老照片：點一下放點、拖曳移動、雙指縮放</span>
  </div>
  <div class="pane" id="modelPane">
    <div id="labels3d"></div>
    <span class="paneTag">3D 模型：點一下放同一個位置、拖曳旋轉</span>
  </div>
  <footer>
    <div class="pairs" id="pairs"></div>
    <div id="status">先在照片上點一個好認的位置（例如鳥居柱腳），再到模型上點同一個位置。</div>
    <div class="fadeRow" id="fadeRow"><span>照片</span><input id="fade" type="range" min="0" max="100" value="50"><span>模型</span></div>
    <div class="row">
      <button id="addPair">＋ 新的一組</button>
      <button id="delPair">刪除這組</button>
      <button id="snapBtn">吸附頂點：開</button>
      <button class="main" id="copyBtn" style="margin-left:auto">複製結果</button>
    </div>
    <div id="help">至少 6 組才會開始計算；點分散在畫面各處、遠近都有，結果最準。</div>
  </footer>
</div>
<div id="toast"></div>
<script type="module" src="./align.js"></script>
</body>
</html>
