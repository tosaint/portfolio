<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1d1b17">
<title>中壢神社｜古今對照</title>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.core.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js">
<link rel="modulepreload" href="./shrine-proc.js">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<style>
  :root { --ink:#1d1b17; --paper:#f6f2e8; --sepia:#8a6b45; --accent:#b23a2a; --gone:#b23a2a; --moved:#c48a1c; --remain:#2f6f4f; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#e9e6dc; color:var(--ink);
    font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; }
  #view { position:fixed; top:0; left:0; right:0; height:100%; touch-action:none; }
  #view canvas { display:block; }
  button { font:inherit; color:inherit; }

  /* 頂部 */
  .top { position:fixed; top:0; left:0; right:0; z-index:5; display:flex; align-items:flex-start; justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 10px) 12px 0; pointer-events:none; gap:8px; }
  .top > * { pointer-events:auto; }
  .brand { background:rgba(246,242,232,.94); border-radius:12px; padding:7px 12px; line-height:1.15; text-decoration:none; color:inherit;
    box-shadow:0 2px 10px rgba(0,0,0,.12); }
  .brand b { font-size:16px; letter-spacing:.08em; }
  .brand small { display:block; font-size:11px; color:#7a7262; }
  .tools { display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  .pill { border:0; background:rgba(246,242,232,.94); border-radius:999px; padding:7px 13px; font-size:14px; font-weight:700;
    box-shadow:0 2px 10px rgba(0,0,0,.12); }
  .pill.on { background:var(--ink); color:var(--paper); }

  /* 3D 上的標籤 */
  #pins { position:fixed; inset:0; pointer-events:none; z-index:3; }
  .pin { position:absolute; left:0; top:0; will-change:transform; pointer-events:auto; display:flex; flex-direction:column; align-items:center; cursor:pointer; }
  .pin span { background:rgba(29,27,23,.85); color:#fff; font-size:12px; font-weight:700; padding:2px 7px; border-radius:7px; white-space:nowrap; }
  .pin i { width:13px; height:13px; border-radius:50%; border:2.5px solid #fff; box-shadow:0 1px 5px rgba(0,0,0,.4); margin-top:3px; }
  .pin.cam span { background:var(--accent); }
  .pin.cam.approx span { background:#8a6b45; }
  .pin.me i { background:#1a73e8; box-shadow:0 0 0 6px rgba(26,115,232,.25); }
  body.far .pin:not(.cam):not(.me) span { display:none; }

  /* 老照片疊合 */
  #photoLayer { position:fixed; left:0; right:0; top:0; z-index:2; pointer-events:none; opacity:0; transition:opacity .4s; }
  #photoLayer.show { opacity:1; }
  #photoLayer .frame { position:relative; width:100%; aspect-ratio:3/2; outline:2px solid rgba(255,255,255,.85); }
  #photoLayer img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #photoLayer .tag { position:absolute; top:6px; left:8px; font-size:11px; color:#fff; background:rgba(0,0,0,.45); padding:2px 7px; border-radius:6px; }
  #photoLayer .tag.r { left:auto; right:8px; }
  #photoLayer .tag.cr { top:auto; bottom:6px; right:8px; left:auto; font-size:10px; }
  .shade { position:fixed; left:0; right:0; z-index:1; background:rgba(29,27,23,.55); pointer-events:none; opacity:0; transition:opacity .4s; }
  .shade.show { opacity:1; }

  /* 底部：探索面板與導覽卡共用 */
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--paper); border-radius:18px 18px 0 0;
    box-shadow:0 -6px 24px rgba(0,0,0,.15); padding:12px 16px calc(env(safe-area-inset-bottom) + 12px); }
  .sheet[hidden] { display:none; }
  .eraRow { display:flex; align-items:center; gap:10px; }
  .eraRow b { font-size:18px; width:22px; text-align:center; }
  .eraRow input { flex:1; accent-color:var(--accent); height:30px; }
  .chips { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; margin:6px 0 8px; }
  .chips::-webkit-scrollbar { display:none; }
  .chips button { flex:0 0 auto; border:1px solid #d8cfba; background:#fff; border-radius:999px; padding:6px 11px; font-size:13px; color:#4a463d; }
  .chips button.on { background:var(--ink); border-color:var(--ink); color:var(--paper); }
  .chips button.fail { opacity:.4; text-decoration:line-through; }
  .row { display:flex; gap:8px; }
  .row button { flex:1; border:0; border-radius:12px; padding:11px 0; font-size:14px; font-weight:700; background:#e4ddcc; }
  .row button.on { background:var(--ink); color:var(--paper); }
  .dims { font-size:14px; font-weight:700; color:var(--ink); background:#ece5d3; border-radius:8px; padding:6px 10px; margin:0 0 8px; }
  .dims small { display:block; font-size:11px; font-weight:400; color:#7a7262; }
  .row button.main { background:var(--ink); color:var(--paper); flex:1.4; }
  .legend { display:flex; gap:12px; font-size:12px; color:#6b6454; margin-top:8px; flex-wrap:wrap; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:-1px; }

  .dots { display:flex; gap:6px; justify-content:center; margin-bottom:8px; }
  .dots i { width:7px; height:7px; border-radius:50%; background:#d3cbb8; }
  .dots i.on { background:var(--ink); width:20px; border-radius:4px; }
  .eyebrow { font-size:11px; letter-spacing:.14em; color:var(--sepia); display:flex; justify-content:space-between; }
  .eyebrow button { border:0; background:none; font-size:12px; color:#7a7262; }
  #tour h2 { font-size:20px; margin:2px 0 6px; letter-spacing:.04em; }
  #tour p { font-size:14px; line-height:1.65; color:#4a463d; min-height:44px; }
  .slider2 { margin-top:10px; display:none; }
  .slider2.show { display:block; }
  .slider2 .lab { display:flex; justify-content:space-between; font-size:12px; color:#7a7262; margin-bottom:2px; }
  .slider2 input { width:100%; accent-color:var(--accent); height:28px; }
  .thumbs { display:none; margin-top:10px; gap:10px; overflow-x:auto; scrollbar-width:none; }
  .thumbs.show { display:flex; }
  .thumbs figure { flex:0 0 112px; margin:0; cursor:zoom-in; }
  .thumbs img { width:112px; height:75px; object-fit:cover; border-radius:8px; display:block; }
  .thumbs figcaption { font-size:11px; line-height:1.35; color:#6b6454; margin-top:3px; }
  #tour .row { margin-top:12px; }
  .note { font-size:11px; color:#9a917d; margin-top:8px; text-align:center; }

  /* 地點卡片 */
  #card { position:fixed; left:0; right:0; bottom:0; z-index:8; background:var(--paper); border-radius:18px 18px 0 0;
    box-shadow:0 -6px 24px rgba(0,0,0,.25); max-height:75vh; overflow-y:auto; transform:translateY(105%); transition:transform .3s ease;
    padding:16px 18px calc(env(safe-area-inset-bottom) + 16px); }
  #card.open { transform:translateY(0); }
  #card .x { position:sticky; top:0; float:right; border:0; width:34px; height:34px; border-radius:50%; background:#e4ddcc; font-size:17px; }
  #card .tag { display:inline-block; font-size:11px; letter-spacing:.1em; color:#fff; padding:2px 8px; border-radius:6px; margin-bottom:6px; }
  #card h2 { font-size:21px; margin-bottom:10px; padding-right:40px; }
  .tl { border-left:3px solid #d8cfba; padding-left:12px; margin:8px 0 12px; }
  .tl div { margin-bottom:8px; font-size:14px; line-height:1.6; color:#4a463d; }
  .tl b { display:block; font-size:11px; letter-spacing:.12em; color:var(--sepia); }
  .tl .now b { color:var(--remain); }
  .imgs img { width:100%; border-radius:10px; margin-bottom:8px; display:block; }
  .imgs .pcredit { display:block; font-size:12px; color:#8a6b45; margin:-2px 0 10px; }
  #card .row { margin:6px 0 10px; }

  .srcs { margin-top:10px; font-size:12px; color:#6b6454; }
  .srcs b, #card h3 { font-size:11px; letter-spacing:.12em; color:var(--sepia); }
  #card h3 { margin:16px 0 6px; }
  .srcs ul, .srcAll { padding-left:1.3em; line-height:1.6; }
  .srcs a, .srcAll a { color:inherit; }
  .srcAll { font-size:12px; color:#4a463d; }
  .timeline { border-left:3px solid #d8cfba; padding-left:12px; }
  .ev { margin-bottom:12px; }
  .ev time { display:block; font-size:12px; font-weight:700; color:var(--accent); letter-spacing:.04em; }
  .ev p { font-size:14px; line-height:1.6; color:#4a463d; }
  .stag span { font-size:11px; color:#8a817a; margin-right:4px; }
  .caveat { font-size:11px; color:#9a917d; margin-top:10px; }
  #lightbox { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.94); display:none; overflow:auto; }
  #lightbox.show { display:block; }
  #lightbox img { width:100%; display:block; margin-top:calc(env(safe-area-inset-top) + 50px); }
  #lightbox span { position:fixed; top:calc(env(safe-area-inset-top) + 10px); right:12px; color:#fff; font-size:15px; background:rgba(255,255,255,.15); padding:6px 12px; border-radius:10px; }
  #toast { position:fixed; top:40%; left:50%; transform:translate(-50%,-50%); z-index:30; background:rgba(29,27,23,.9); color:#fff;
    padding:10px 16px; border-radius:12px; font-size:14px; display:none; max-width:80vw; text-align:center; }
  /* 桌機：面板浮在左下，3D 佔滿整個畫面 */
  @media (min-width: 900px) {
    .sheet, #card { left:16px; right:auto; bottom:16px; width:440px; border-radius:16px; box-shadow:0 6px 24px rgba(0,0,0,.18); }
    #card { max-height:calc(100vh - 100px); transform:translateY(calc(100% + 30px)); }
    #card.open { transform:none; }
  }
  #credit { position:fixed; right:6px; z-index:4; font-size:10px; color:#6b6454; background:rgba(246,242,232,.75); padding:1px 6px; border-radius:6px; pointer-events:none; }
  #loading { position:fixed; inset:0; z-index:40; background:var(--ink); color:var(--paper); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; transition:opacity .5s; }
  #loading b { font-size:24px; letter-spacing:.3em; }
  #loading small { color:#b8ae98; }
</style>
</head>
<body>
<div id="view"></div>
<div class="shade" id="shadeTop"></div><div class="shade" id="shadeBot"></div>
<div id="photoLayer"><div class="frame"><img id="photoImg" alt="中壢神社老照片"><span class="tag">老照片</span><span class="tag r">3D 模型</span><span class="tag cr">三森久子捐贈，壢中校史館藏</span></div></div>
<div id="pins"></div>
<div id="credit"></div>

<div class="top">
  <a class="brand" href="../"><b>中壢神社 · 古今對照</b><small>‹ 作品說明 ／ 1939 → 今</small></a>
  <div class="tools">
    <button class="pill" id="locBtn">◎ 我在哪</button>
  </div>
</div>

<!-- 探索面板 -->
<div class="sheet" id="explore">
  <div class="eraRow"><b>古</b><input id="era" type="range" min="0" max="100" value="0" aria-label="古今：神社模型與舊地圖的透明度"><b>今</b></div>
  <div class="chips" id="groundChips"></div>
  <div class="chips" id="viewChips" aria-label="移到建築旁"></div>
  <div class="row">
    <button id="viewTop">俯視</button>
    <button id="view3d">立體</button>
    <button id="histBtn">史料</button>
    <button id="scaleBtn">比例尺</button>
    <button class="main" id="startTour">▶ 六站導覽</button>
  </div>
  <div class="legend">
    <span><i style="background:var(--gone)"></i>已消失</span>
    <span><i style="background:var(--moved)"></i>被搬走</span>
    <span><i style="background:var(--remain)"></i>還找得到</span>
  </div>
</div>

<!-- 導覽卡 -->
<div class="sheet" id="tour" hidden>
  <div class="dots" id="dots"></div>
  <div class="eyebrow"><span id="stopNo"></span><button id="endTour">✕ 結束導覽</button></div>
  <h2 id="stopTitle"></h2>
  <p id="stopText"></p>
  <div class="slider2" id="slider2">
    <div class="lab"><span>◀ 老照片</span><span>3D 模型 ▶</span></div>
    <input id="fade" type="range" min="0" max="100" value="0" aria-label="老照片與模型的透明度">
  </div>
  <div class="thumbs" id="thumbs"></div>
  <div class="row"><button id="prev" style="flex:0 0 30%">上一站</button><button class="main" id="next">下一站</button></div>
  <div class="note">模型依配置圖與老照片推估，非測繪復原</div>
</div>

<div id="card"><button class="x" id="cardX">✕</button><div id="cardBody"></div></div>
<div id="lightbox"><span>✕ 關閉</span><img id="lightImg" alt=""></div>
<div id="toast"></div>
<div id="loading"><b>中壢神社</b><small id="loadMsg">模型載入中…</small></div>

<script type="module" src="./main.js?v=20261103u"></script>
</body>
</html>
