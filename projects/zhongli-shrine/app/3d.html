<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1d1b17">
<title>中壢神社｜古今對照</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<style>
  :root { --ink:#1d1b17; --paper:#f6f2e8; --sepia:#8a6b45; --accent:#b23a2a; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#e9e6dc; color:var(--ink);
    font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; }
  #view { position:fixed; top:0; left:0; right:0; height:100%; touch-action:none; }
  #view canvas { display:block; }

  /* 頂部 */
  .top { position:fixed; top:0; left:0; right:0; z-index:5; display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; pointer-events:none; }
  .brand { pointer-events:auto; background:rgba(246,242,232,.92); border-radius:12px; padding:7px 12px; line-height:1.15;
    box-shadow:0 2px 10px rgba(0,0,0,.08); }
  .brand b { font-size:16px; letter-spacing:.08em; }
  .brand small { display:block; font-size:11px; color:#7a7262; letter-spacing:.06em; }
  .era { pointer-events:auto; display:flex; background:rgba(246,242,232,.92); border-radius:999px; padding:3px;
    box-shadow:0 2px 10px rgba(0,0,0,.08); }
  .era button { border:0; background:none; font:inherit; font-size:15px; font-weight:700; padding:7px 14px; border-radius:999px; color:#7a7262; }
  .era button.on { background:var(--ink); color:var(--paper); }

  .rightTools { display:flex; flex-direction:column; align-items:flex-end; gap:8px; pointer-events:auto; }
  .groundBtn { border:0; background:rgba(246,242,232,.92); border-radius:999px; padding:6px 12px; font:inherit; font-size:13px; font-weight:700;
    color:var(--ink); box-shadow:0 2px 10px rgba(0,0,0,.08); }
  .groundBtn[hidden] { display:none; }
  /* 地圖上的標籤 */
  #pins { position:fixed; inset:0; pointer-events:none; z-index:3; }
  .pin { position:absolute; transform:translate(-50%,-100%); background:var(--ink); color:var(--paper); font-size:12px;
    padding:3px 8px; border-radius:8px; white-space:nowrap; pointer-events:auto; }
  .pin::after { content:""; position:absolute; left:50%; bottom:-5px; transform:translateX(-50%); border:5px solid transparent;
    border-bottom:0; border-top-color:var(--ink); }
  .pin.cam { background:var(--accent); }
  .pin.cam::after { border-top-color:var(--accent); }

  /* 老照片疊合層 */
  #photoLayer { position:fixed; left:0; right:0; top:0; z-index:2; pointer-events:none;
    opacity:0; transition:opacity .4s; }
  #photoLayer.show { opacity:1; }
  #photoLayer .frame { position:relative; width:100%; aspect-ratio:3/2; outline:2px solid rgba(255,255,255,.85); }
  #photoLayer img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #photoLayer .tag { position:absolute; top:6px; left:8px; font-size:11px; color:#fff; background:rgba(0,0,0,.45); padding:2px 7px; border-radius:6px; }
  #photoLayer .tag.r { left:auto; right:8px; }
  .shade { position:fixed; left:0; right:0; z-index:1; background:rgba(29,27,23,.55); pointer-events:none; opacity:0; transition:opacity .4s; }
  .shade.show { opacity:1; }

  /* 底部故事卡 */
  #sheet { position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--paper); border-radius:20px 20px 0 0;
    box-shadow:0 -6px 24px rgba(0,0,0,.15); padding:14px 18px calc(env(safe-area-inset-bottom) + 14px); }
  .dots { display:flex; gap:6px; justify-content:center; margin-bottom:10px; }
  .dots i { width:7px; height:7px; border-radius:50%; background:#d3cbb8; }
  .dots i.on { background:var(--ink); width:20px; border-radius:4px; }
  .eyebrow { font-size:11px; letter-spacing:.14em; color:var(--sepia); }
  #sheet h2 { font-size:21px; margin:2px 0 6px; letter-spacing:.04em; }
  #sheet p { font-size:14px; line-height:1.65; color:#4a463d; min-height:46px; }
  .slider { margin-top:12px; display:none; }
  .slider.show { display:block; }
  .slider .lab { display:flex; justify-content:space-between; font-size:12px; color:#7a7262; margin-bottom:4px; }
  .slider input { width:100%; accent-color:var(--accent); height:28px; }
  .thumb { display:none; margin-top:10px; gap:10px; align-items:center; }
  .thumb.show { display:flex; }
  .thumb img { width:84px; height:63px; object-fit:cover; border-radius:8px; }
  .thumb span { font-size:13px; color:#4a463d; }
  .nav { display:flex; gap:10px; margin-top:12px; }
  .nav button { flex:1; border:0; border-radius:12px; padding:12px 0; font:inherit; font-size:15px; font-weight:700; }
  #prev { background:#e4ddcc; color:var(--ink); flex:0 0 30%; }
  #next { background:var(--ink); color:var(--paper); }
  .note { font-size:11px; color:#9a917d; margin-top:8px; text-align:center; }

  /* 全螢幕看照片 */
  #lightbox { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; }
  #lightbox.show { display:flex; }
  #lightbox img { max-width:100%; max-height:100%; }

  #loading { position:fixed; inset:0; z-index:30; background:var(--ink); color:var(--paper); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; transition:opacity .5s; }
  #loading b { font-size:24px; letter-spacing:.3em; }
  #loading small { color:#b8ae98; }
</style>
</head>
<body>
<div id="view"></div>
<div class="shade" id="shadeTop"></div><div class="shade" id="shadeBot"></div>
<div id="photoLayer"><div class="frame"><img id="photoImg" src="./assets/photo-study/historical.jpg" alt="中壢神社老照片"><span class="tag">老照片</span><span class="tag r">3D 模型</span></div></div>
<div id="pins"></div>

<div class="top">
  <a class="brand" href="./index.html" style="text-decoration:none;color:inherit"><b>‹ 古今地圖</b><small>中壢神社 3D 復原</small></a>
  <div class="rightTools">
    <div class="era" role="group" aria-label="切換年代">
      <button id="eraPast" class="on">古</button><button id="eraNow">今</button>
    </div>
    <button id="groundBtn" class="groundBtn" hidden>地面：航照</button>
  </div>
</div>

<div id="sheet">
  <div class="dots" id="dots"></div>
  <div class="eyebrow" id="stopNo"></div>
  <h2 id="stopTitle"></h2>
  <p id="stopText"></p>
  <div class="slider" id="slider">
    <div class="lab"><span>◀ 老照片</span><span>3D 模型 ▶</span></div>
    <input id="fade" type="range" min="0" max="100" value="0" aria-label="老照片與模型的透明度">
  </div>
  <div class="thumb" id="thumb"><img id="thumbImg" alt="現況照片"><span>點照片放大看現況</span></div>
  <div class="nav"><button id="prev">上一站</button><button id="next">下一站</button></div>
  <div class="note">模型依配置圖與老照片推估，非測繪復原</div>
</div>

<div id="lightbox"><img id="lightImg" alt=""></div>
<div id="loading"><b>中壢神社</b><small id="loadMsg">模型載入中…</small></div>

<script type="module" src="./tour.js"></script>
</body>
</html>
