<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中壢神社 心願繪馬牆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&display=swap">
<style>
  :root { --paper:#f3efe4; --ink:#2b2a27; --ink2:#5f5a52; --wood:#8a6438; --red:#8f2a2a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:400 15px/1.7 "Noto Serif TC", serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; display:flex; flex-direction:column; gap:16px; }
  header { display:flex; gap:12px; align-items:center; }
  header img { width:42px; height:42px; border-radius:50%; }
  h1 { margin:0; font-size:22px; font-weight:600; letter-spacing:.12em; }
  p { margin:0; }
  .sub, .note { font-size:13px; color:var(--ink2); }
  label { font-size:13px; color:var(--ink2); }
  input { width:100%; height:46px; border:1px solid #cfc6b4; border-radius:10px; padding:0 14px; font:inherit; background:#fffdf8; color:var(--ink); }
  .rack { position:relative; padding-top:0; margin-bottom:6px; }
  .rack::before { content:""; position:absolute; left:-16px; right:-16px; top:14px; height:8px; background:var(--wood); border-radius:2px; }
  .row { display:grid; grid-template-columns:repeat(var(--n), minmax(0,1fr)); gap:10px; position:relative; }
  .ema { border:none; background:none; padding:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; }
  .ema canvas { width:100%; height:auto; display:block; }
  .ema.me canvas { filter: drop-shadow(0 0 10px rgba(179,50,43,.55)); }
  .ema:focus-visible { outline:2px solid var(--red); outline-offset:4px; }
  dialog { border:none; border-radius:16px; padding:16px; max-width:min(600px, 94vw); background:var(--paper); }
  dialog::backdrop { background:rgba(20,18,15,.6); }
  dialog canvas { width:100%; height:auto; display:block; }
  .btns { display:flex; gap:10px; margin-top:10px; }
  .btns button { flex:1; min-height:44px; border-radius:10px; font:inherit; cursor:pointer; border:1.5px solid var(--ink); background:transparent; color:var(--ink); }
  footer { text-align:center; }
</style>
</head>
<body>
<main>
  <header>
    <img src="kamon-ink.png" alt="中壢神社社紋">
    <div>
      <h1>心願繪馬牆</h1>
      <p class="sub">通過考證測驗的人，繪馬掛在這裡　<span id="count"></span></p>
    </div>
  </header>
  <div>
    <label for="q">找我的繪馬</label>
    <input id="q" type="search" placeholder="輸入暱稱或編號，例如 0128" autocomplete="off">
  </div>
  <section id="wall" aria-live="polite"></section>
  <footer class="note">當代參與創作，並非中壢神社原有設施　·　暱稱與祈願經本人同意、教師審核後公開<br><a href="../app/" style="color:var(--red)">回到神社</a></footer>
</main>
<dialog id="dlg">
  <canvas id="big" aria-label="繪馬放大"></canvas>
  <div class="btns"><button id="flip" type="button">翻到正面</button><button id="close" type="button">關閉</button></div>
</dialog>
<script type="module">
import { drawFront, drawBack } from './ema.js';
import { EMA_API } from './config.js';
const api = new URLSearchParams(location.search).get('api') || EMA_API;
const mine = new URLSearchParams(location.search).get('no');
const wall = document.getElementById('wall');
let all = [];
const perRow = () => innerWidth >= 900 ? 6 : innerWidth >= 600 ? 4 : 3;
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); drawBack(e.target, e.target._d, 0.9, true); } }), { rootMargin: '200px' });
function render(list) {
  wall.innerHTML = '';
  const n = perRow();
  for (let i = 0; i < list.length; i += n) {
    const rack = document.createElement('div'); rack.className = 'rack';
    const row = document.createElement('div'); row.className = 'row'; row.style.setProperty('--n', n);
    list.slice(i, i + n).forEach(d => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'ema' + (d.no === mine ? ' me' : '');
      b.setAttribute('aria-label', `No.${d.no} ${d.n || ''} ${d.w || ''}`);
      const c = document.createElement('canvas'); c._d = d; b.append(c); io.observe(c);
      b.onclick = () => open(d);
      row.append(b);
    });
    rack.append(row); wall.append(rack);
  }
  if (!list.length) wall.innerHTML = '<p class="note">' + (all.length ? '找不到符合的繪馬。' : '繪馬牆還沒有繪馬。') + '</p>';
}
let cur = null, front = false;
const dlg = document.getElementById('dlg'), big = document.getElementById('big'), flip = document.getElementById('flip');
function open(d) { cur = d; front = false; drawBack(big, d, 2); flip.textContent = '翻到正面'; dlg.showModal(); }
flip.onclick = () => { front = !front; (front ? drawFront : drawBack)(big, cur, 2); flip.textContent = front ? '翻到背面' : '翻到正面'; };
document.getElementById('close').onclick = () => dlg.close();
document.getElementById('q').oninput = e => {
  const q = e.target.value.trim();
  render(q ? all.filter(d => (d.no || '').includes(q) || (d.n || '').includes(q)) : all);
};
let lastN = perRow(); addEventListener('resize', () => { if (perRow() !== lastN) { lastN = perRow(); render(all); } });
(async () => {
  if (!api) { wall.innerHTML = '<p class="note">繪馬牆即將開放。</p>'; return; }
  try {
    const r = await fetch(api); all = (await r.json()).items || [];
    document.getElementById('count').textContent = `共 ${all.length} 片`;
    if (mine) { const i = all.findIndex(d => d.no === mine); if (i > 0) all.unshift(...all.splice(i, 1)); }
    render(all);
  } catch (e) { wall.innerHTML = '<p class="note">繪馬牆暫時讀不到資料，請稍後再試。</p>'; }
})();
</script>
</body>
</html>
