<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 110 600 450" fill="none" stroke="#2b2a27" stroke-linecap="round" stroke-linejoin="round">
<!-- 杜布森式望遠鏡 Dobsonian telescope, side elevation: tube on its altitude bearing,
     rocker box and ground board; the dotted line is the sight line toward the sign across the courtyard -->
<path d="M534 270 L 626 233" stroke-width=".9" stroke-dasharray="1.2 5" opacity=".6"/>
<path d="M624 222 l 0 8 M620 226 l 8 0" stroke-width="1"/>
<g transform="rotate(-22 310 360)">
  <rect x="96" y="294" width="440" height="132" fill="#fff" stroke-width="1.6"/>
  <rect x="530" y="288" width="14" height="144" fill="#fff" stroke-width="1.6"/>
  <rect x="84" y="292" width="14" height="136" fill="#fff" stroke-width="1.6"/>
  <path d="M120 300 L 120 420 M512 300 L 512 420" stroke-width=".7" opacity=".5"/>
  <!-- focuser, drawtube and eyepiece -->
  <rect x="448" y="270" width="40" height="24" fill="#fff" stroke-width="1.4"/>
  <rect x="457" y="246" width="22" height="24" fill="#fff" stroke-width="1.2"/>
  <rect x="453" y="216" width="30" height="30" fill="#fff" stroke-width="1.4"/>
  <path d="M453 226 l 30 0" stroke-width=".8"/>
  <rect x="455" y="208" width="26" height="8" rx="2" fill="#fff" stroke-width="1.2"/>
  <circle cx="440" cy="282" r="7" fill="#fff" stroke-width="1.2"/>
  <circle cx="496" cy="282" r="7" fill="#fff" stroke-width="1.2"/>
  <!-- finder on two rings -->
  <rect x="318" y="262" width="104" height="18" fill="#fff" stroke-width="1.3"/>
  <rect x="418" y="258" width="18" height="26" fill="#fff" stroke-width="1.3"/>
  <rect x="304" y="266" width="16" height="10" fill="#fff" stroke-width="1.1"/>
  <path d="M344 280 l 0 14 M396 280 l 0 14" stroke-width="1.3"/>
  <path d="M340 294 l 60 0" stroke-width="1.3"/>
</g>
<!-- rocker box side board with the cradle for the bearing -->
<path d="M186 512 L 186 360 L 254 360 A 56 56 0 0 0 366 360 L 434 360 L 434 512 Z" fill="#fff" stroke-width="1.6"/>
<circle cx="310" cy="360" r="50" fill="#fff" stroke-width="1.6"/>
<circle cx="310" cy="360" r="14" fill="#fff" stroke-width="1.3"/>
<circle cx="310" cy="360" r="5" stroke-width="1"/>
<!-- ground board -->
<rect x="164" y="512" width="292" height="16" fill="#fff" stroke-width="1.6"/>
<rect x="178" y="528" width="22" height="8" fill="#fff" stroke-width="1.2"/>
<rect x="420" y="528" width="22" height="8" fill="#fff" stroke-width="1.2"/>
<path d="M120 537 L 500 537" stroke-width=".9" stroke-dasharray="1.2 4" opacity=".45"/>
</svg>
