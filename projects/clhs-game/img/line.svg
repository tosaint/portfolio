<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" stroke="#2b2a27" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
<!-- 中壢神社app：自參道望第二鳥居，兩側石燈籠；橫木下浮著一顆寶物標記與光柱
     The second torii seen from the approach, a stone lantern on each side, and a treasure marker under the lintel -->
<!-- ground line and the approach path, converging -->
<path d="M40 500 H300 M500 500 H760" stroke-width="1"/>
<path d="M250 590 L352 500 M550 590 L448 500" stroke-width="1"/>
<path d="M330 590 L376 500 M470 590 L424 500" stroke-width=".8" stroke-dasharray="2 7" opacity=".7"/>
<!-- three steps -->
<path d="M300 500 H500 M308 490 H492 M316 480 H484 M300 500 V490 H308 V480 H316 M500 500 V490 H492 V480 H484"/>
<!-- torii: columns lean inward -->
<path d="M318 480 L332 178 H350 L340 480 Z M482 480 L468 178 H450 L460 480 Z" fill="#fff"/>
<!-- column bases -->
<path d="M310 480 h38 v-12 h-38 Z M452 480 h38 v-12 h-38 Z" fill="#fff"/>
<!-- nuki (lower tie beam) with wedges, and the central strut -->
<path d="M290 236 H510 V254 H290 Z" fill="#fff"/>
<path d="M392 178 H408 V236 H392 Z" fill="#fff"/>
<!-- shimaki and kasagi (upper lintels), ends curving up -->
<path d="M268 160 Q400 172 532 160 L530 178 Q400 188 270 178 Z" fill="#fff"/>
<path d="M246 132 Q400 156 554 132 L548 160 Q400 174 252 160 Z" fill="#fff"/>
<!-- shimenawa with paper streamers -->
<path d="M341 268 Q400 292 459 268" stroke-width="2.4"/>
<path d="M366 280 l-4 16 l8 0 l-4 14 M400 286 l-4 16 l8 0 l-4 14 M434 280 l-4 16 l8 0 l-4 14" stroke-width="1"/>
<!-- stone lanterns -->
<g id="lan" fill="#fff">
  <path d="M96 500 h84 v-12 h-84 Z M106 488 h64 v-12 h-64 Z M116 476 h44 v-10 h-44 Z"/>
  <path d="M130 466 L134 400 H142 L146 466 Z"/>
  <path d="M120 400 h36 v-10 h-36 Z"/>
  <path d="M124 390 h28 v-30 h-28 Z"/><path d="M133 382 h10 v-14 h-10 Z"/>
  <path d="M104 360 Q138 352 172 360 L156 338 H120 Z"/>
  <path d="M132 338 q6 -16 12 0"/>
</g>
<use href="#lan" x="524"/>
<!-- the marker: a diamond with a beam of light rising through the picture -->
<path d="M400 60 V318" stroke-width="1" stroke-dasharray="1.5 6"/>
<path d="M391 60 V300 M409 60 V300" stroke-width=".7" opacity=".45"/>
<path d="M400 318 L426 356 L400 394 L374 356 Z" fill="#fff" stroke-width="2"/>
<path d="M374 356 H426 M400 318 L390 356 L400 394 M400 318 L410 356 L400 394" stroke-width="1"/>
<path d="M352 356 h-12 M448 356 h12 M362 326 l-8 -8 M438 326 l8 -8 M362 386 l-8 8 M438 386 l8 8" stroke-width="1"/>
</svg>
